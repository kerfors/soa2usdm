[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "soa2usdm"
version = "0.1.0"
description = "Extract Schedule of Activities (SoA) tables from clinical trial protocols into structured, USDM-ready data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
notebooks = ["pandas", "requests", "pymupdf", "pymupdf4llm", "openpyxl"]
# Page geometry (soa2usdm.page_grid, soa2usdm.row_audit) also needs poppler
# on PATH: pdftoppm, pdftotext, pdfinfo.
bands = ["numpy"]
test = ["pytest"]

[project.scripts]
soa2usdm-activities = "soa2usdm.activity_inventory:main"
soa2usdm-row-audit = "soa2usdm.row_audit:main"

[tool.setuptools]
packages = ["soa2usdm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
